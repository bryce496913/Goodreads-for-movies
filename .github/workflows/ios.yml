name: iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Xcode and select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PYTHON'
          import json, os
          with open(os.path.join(os.environ["RUNNER_TEMP"], "simulators.json")) as stream:
              devices = json.load(stream)["devices"]
          for runtime, candidates in sorted(devices.items(), reverse=True):
              if ".iOS-" not in runtime:
                  continue
              if int(runtime.split(".iOS-")[1].split("-")[0]) < 17:
                  continue
              for device in candidates:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                          output.write(f"id={device['udid']}\n")
                      print(f"Selected {device['name']} ({runtime})")
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator with iOS 17 or later")
          PYTHON
      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test \
            -project MovieTracker.xcodeproj \
            -scheme MovieTracker \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath "$RUNNER_TEMP/MovieTrackerDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/MovieTracker.xcresult" \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MovieTracker-test-results
          path: ${{ runner.temp }}/MovieTracker.xcresult
          if-no-files-found: ignore
